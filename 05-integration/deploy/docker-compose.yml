# Tromox 回调服务：一台 VPS、一个容器、一个 SQLite 文件（deployment.md 第 1 节）。
# 在本目录执行 docker compose 命令。可插值变量（写在本目录 .env 或 shell 环境里）：
#   TROMOX_ENV_FILE   传给容器的环境变量文件，默认 .env。它只管传给容器：下面几项 TROMOX_* 的插值只认
#                     本目录 .env 与 shell 环境；指到别处时写在那个文件里的 TROMOX_DATA_DIR 等会被静默忽略，
#                     要么在 shell 里 export 这几项，要么 docker compose --env-file <那个文件> ...
#   TROMOX_BIND       宿主机绑定地址，默认 127.0.0.1（公网流量一律经反向代理进入）
#   TROMOX_HTTP_PORT  宿主机端口，默认 8000
#   TROMOX_DATA_DIR   宿主机数据目录（SQLite + CSV），默认 ./data；服务器上建议放仓库之外，如 /opt/tromox/data
#   TROMOX_FORWARDED_ALLOW_IPS  uvicorn 信任哪些来源的代理头：未设取 *，设成空就是谁都不信（见下面 webhook 服务的注释）
# caddy 服务带 profile "proxy"：不加 --profile proxy 就不起（本机 smoke test 不占 80/443）。
# 容器按最小权限跑：根文件系统只读、去掉全部 capabilities、禁止提权（deploy/README.md「安全基线」一节）。
name: tromox

services:
  webhook:
    build:
      context: ../..                                   # 构建上下文是仓库根目录（镜像需要 pyproject.toml 与 shared/）
      dockerfile: 05-integration/webhook-service/Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"   # 构建慢时指向 PyPI 镜像（Dockerfile 里的同名 ARG）
    image: tromox-webhook
    restart: unless-stopped
    env_file:
      - "${TROMOX_ENV_FILE:-.env}"
    environment:
      # uvicorn 只在来源属于这里列出的地址时才采信 X-Forwarded-For（支持 IP、CIDR、*）。
      # 默认 *：8000 端口只绑 127.0.0.1，唯一入口是同一 compose 网络里的 Caddy，
      # 它的容器地址每次重建都会变，写死没有意义，所以信任全部代理头。
      # 若把 8000 直接暴露到公网（TROMOX_BIND 改成 0.0.0.0），必须在 .env 里把
      # TROMOX_FORWARDED_ALLOW_IPS 改成 Caddy 的固定 IP，或留空（谁的代理头都不信）。
      # 注意：这里的 environment 会盖掉 env_file，改值要改 TROMOX_FORWARDED_ALLOW_IPS，
      # 直接在 .env 里写 FORWARDED_ALLOW_IPS 不生效。
      # 下面是 "-*" 不带冒号，是故意的：未设取 *，设成空（TROMOX_FORWARDED_ALLOW_IPS=）就是空串，
      # uvicorn 谁的代理头都不信；带冒号的写法在变量为空时也取 *，"留空" 就不生效了。
      FORWARDED_ALLOW_IPS: "${TROMOX_FORWARDED_ALLOW_IPS-*}"
    read_only: true                                    # 根文件系统只读；要写的只有 /srv/data 卷与下面的 /tmp
    tmpfs:
      - /tmp                                           # 临时目录（Python tempfile 的默认位置），进内存、重启即清；app.forget / app.retention 等运维命令只写 /srv/data
    cap_drop:
      - ALL                                            # 服务不需要任何 capability（以 uid 10001 跑、只监听 8000）
    security_opt:
      - "no-new-privileges:true"                       # 容器内进程拿不到更高权限（setuid 提权失效）
    pids_limit: 256                                    # 进程 / 线程上限，防止 fork 炸弹拖垮宿主机
    ports:
      - "${TROMOX_BIND:-127.0.0.1}:${TROMOX_HTTP_PORT:-8000}:8000"
    volumes:
      - "${TROMOX_DATA_DIR:-./data}:/srv/data"         # 绑定挂载；目录要 chown 10001（容器内的运行用户）
    logging:
      driver: json-file
      options:
        max-size: "10m"                                # 单文件 10 MB，保留 5 个 = 日志轮转
        max-file: "5"
    healthcheck:                                       # 与 Dockerfile 里的 HEALTHCHECK 同一条
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2
    profiles:
      - proxy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE                               # 只留绑 80 / 443 这一项（Caddy 以 root 起再降权）
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - webhook
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro            # 由 Caddyfile.example 复制并改域名
      - caddy_data:/data                               # 证书与 ACME 账号，删了会重新签发
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
